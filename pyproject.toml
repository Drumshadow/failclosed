[project]
name = "failclosed"
version = "0.1.0"
description = "Measure what AI agent guardrails do when they break."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["failclosed"]

[tool.setuptools.package-data]
failclosed = ["catalog.yaml"]
